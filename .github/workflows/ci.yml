name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release
      - 'fix/**'
      - production-readiness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension and webviews
        run: npm run build

      - name: Package universal VSIX
        run: npm run package:vsix

      - name: Verify packaged VSIX
        run: node scripts/verify-universal-vsix.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Upload VSIX
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: atomic-sherpa-vsix
          path: releases/*.vsix
          if-no-files-found: error
